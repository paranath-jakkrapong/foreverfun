<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>หมายเลขรูป</title>
<style>
  body { margin: 0; padding: 24px 16px 48px; background: #FFF6FA; color: #5E1A45; font-family: 'Leelawadee UI', Tahoma, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 22px; color: #A82869; }
  p { margin: 0 0 20px; font-size: 14px; color: #8A5273; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  figure { margin: 0; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 12px 24px -16px rgba(212, 69, 143, .7); }
  img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
  figcaption { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
  b { font-size: 18px; color: #D4458F; }
  span { font-size: 12px; color: #8A5273; word-break: break-all; }
</style>
</head>
<body>
<h1>หมายเลขรูป (1 รูป)</h1>
<p>ตัวเลขใหญ่คือหมายเลขรูปในเว็บ · ตัวเล็กคือชื่อไฟล์เดิมในโฟลเดอร์ Picture</p>
<main>
  <figure><img src="assets/couple/001-s.jpg" alt="" loading="lazy"><figcaption><b>No. 001</b><span>1.jpg</span></figcaption></figure>
</main>
</body>
</html>
